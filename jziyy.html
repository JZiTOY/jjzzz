<style>
:root{--ink:#302b35;--muted:#716b77;--line:rgba(48,43,53,.14);--paper:rgba(255,252,247,.84);--rose:#ff7d92;--peach:#ffbd8f;--mint:#8edfc1;--sky:#8fc7ff;--violet:#c49aff;--r:8px;--shadow:0 24px 70px rgba(80,58,80,.16);font-family:ui-rounded,"Microsoft YaHei UI","Microsoft YaHei",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);background:radial-gradient(circle at 14% 18%,rgba(255,189,143,.46),transparent 25rem),radial-gradient(circle at 86% 8%,rgba(142,223,193,.42),transparent 28rem),radial-gradient(circle at 68% 86%,rgba(143,199,255,.32),transparent 26rem),linear-gradient(135deg,#fff8ee,#fff1f6 52%,#effaf5);overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;background-image:linear-gradient(120deg,rgba(255,255,255,.32) 0 1px,transparent 1px 22px),radial-gradient(circle,rgba(255,255,255,.82) 0 1px,transparent 1.5px);background-size:36px 36px,28px 28px;mask-image:linear-gradient(to bottom,#000,transparent 85%)}h1,h2,h3,p{margin:0}button,input{font:inherit}button{border:0;cursor:pointer;color:inherit;-webkit-tap-highlight-color:transparent}.app{width:min(1180px,calc(100% - 28px));margin:0 auto;padding:20px 0 44px;position:relative}.app[aria-hidden=true]{visibility:hidden}.topbar{min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:12px;min-width:0}.mark{width:48px;height:48px;border-radius:50%;background:radial-gradient(circle at 34% 30%,#fff 0 13%,transparent 14%),conic-gradient(from 140deg,var(--rose),var(--peach),var(--mint),var(--sky),var(--rose));box-shadow:0 14px 28px rgba(255,125,146,.24);flex:0 0 auto}h1{font-size:clamp(1.35rem,3vw,2.2rem);line-height:1.05;letter-spacing:0}.subtle{color:var(--muted);font-size:.94rem;margin-top:6px}.actions{display:flex;align-items:center;justify-content:flex-end;gap:10px;flex-wrap:wrap}.icon-btn,.pill-btn,.ghost{height:42px;border-radius:var(--r);background:rgba(255,255,255,.7);border:1px solid var(--line);box-shadow:0 12px 34px rgba(70,62,74,.1);transition:transform .2s ease,background .2s ease,box-shadow .2s ease}.icon-btn{width:42px;display:grid;place-items:center;font-size:1.25rem}.pill-btn,.ghost{padding:0 15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700}.icon-btn:hover,.pill-btn:hover,.ghost:hover{transform:translateY(-2px);background:rgba(255,255,255,.94);box-shadow:0 16px 42px rgba(70,62,74,.14)}.stage{margin-top:24px;display:grid;grid-template-columns:1fr 330px;gap:18px;align-items:start}.panel{border:1px solid var(--line);background:var(--paper);backdrop-filter:blur(18px);border-radius:var(--r);box-shadow:var(--shadow)}.hero{min-height:250px;padding:clamp(22px,5vw,44px);position:relative;overflow:hidden;display:grid;align-content:end}.hero:after{content:"";position:absolute;inset:auto -6% -18% 36%;height:180px;background:linear-gradient(90deg,rgba(255,125,146,.18),transparent 72%),repeating-linear-gradient(92deg,rgba(43,42,51,.13) 0 1px,transparent 1px 18px);transform:rotate(-5deg);border-radius:50%}.hero h2{max-width:8ch;font-size:clamp(2.2rem,8vw,6.6rem);line-height:.9;letter-spacing:0;position:relative;z-index:1}.hero p{max-width:36rem;margin-top:16px;color:var(--muted);font-size:1rem;line-height:1.8;position:relative;z-index:1}.side{padding:18px;display:grid;gap:14px}.meter{min-height:116px;padding:18px;border-radius:var(--r);background:linear-gradient(135deg,rgba(255,125,146,.18),rgba(142,223,193,.2)),rgba(255,255,255,.46);display:grid;align-content:space-between;gap:12px}.meter strong{font-size:2.4rem;line-height:1;letter-spacing:0}.meter span{color:var(--muted)}.albums-head{margin:28px 0 14px;display:flex;align-items:center;justify-content:space-between;gap:12px}.album-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.album-card{min-height:254px;padding:12px;border-radius:var(--r);background:rgba(255,255,255,.72);border:1px solid var(--line);box-shadow:0 15px 45px rgba(70,62,74,.1);transition:transform .28s cubic-bezier(.2,.8,.2,1),box-shadow .28s ease;display:grid;grid-template-rows:1fr auto;gap:12px;overflow:hidden;text-align:left}.album-card:hover{transform:translateY(-5px) rotate(-.5deg);box-shadow:0 24px 58px rgba(70,62,74,.16)}.cover{min-height:164px;border-radius:var(--r);overflow:hidden;position:relative;background:linear-gradient(135deg,rgba(255,255,255,.5),transparent),var(--tone,linear-gradient(135deg,var(--peach),var(--mint)))}.cover img{width:100%;height:100%;object-fit:cover;display:block;position:absolute;inset:0;transition:transform .45s ease}.album-card:hover .cover img{transform:scale(1.05)}.empty-shape{position:absolute;inset:18px;border:1px solid rgba(255,255,255,.72);border-radius:var(--r);display:grid;place-items:center;color:rgba(43,42,51,.58);font-size:2rem}.album-title{display:flex;align-items:end;justify-content:space-between;gap:10px}.album-title h3{font-size:1.08rem;overflow-wrap:anywhere}.album-title span{color:var(--muted);font-size:.9rem;white-space:nowrap}.album-note{margin-top:5px;color:var(--muted);font-size:.9rem;overflow-wrap:anywhere}.album-view{position:fixed;inset:0;z-index:20;padding:22px;background:rgba(255,248,244,.72);backdrop-filter:blur(18px);display:grid;opacity:0;pointer-events:none;transition:opacity .28s ease}.album-view.open{opacity:1;pointer-events:auto}.album-shell{width:min(1080px,100%);max-height:calc(100vh - 44px);margin:auto;overflow:hidden;display:grid;grid-template-rows:auto 1fr;transform:translateY(22px) scale(.98);transition:transform .42s cubic-bezier(.2,.8,.2,1)}.album-view.open .album-shell{transform:translateY(0) scale(1)}.album-toolbar{padding:14px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}.album-toolbar h2{font-size:1.2rem;overflow-wrap:anywhere}.photo-grid{padding:14px;overflow:auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.photo{aspect-ratio:1;border-radius:var(--r);overflow:hidden;background:rgba(255,255,255,.74);position:relative;transform:translateY(14px);opacity:0;animation:floatIn .46s cubic-bezier(.2,.8,.2,1) forwards;box-shadow:0 10px 30px rgba(70,62,74,.1)}.photo img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s ease}.photo:hover img{transform:scale(1.06)}.photo button{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.78);opacity:0;transition:opacity .2s ease}.photo:hover button{opacity:1}.empty{grid-column:1/-1;min-height:230px;border:1px dashed rgba(43,42,51,.18);border-radius:var(--r);display:grid;place-items:center;color:var(--muted);text-align:center;padding:24px;line-height:1.8}.gate{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:18px;background:radial-gradient(circle at 18% 20%,rgba(255,125,146,.34),transparent 24rem),radial-gradient(circle at 82% 10%,rgba(142,223,193,.4),transparent 24rem),linear-gradient(135deg,#fff7ef,#fff2f7 58%,#eefaf4)}.gate-card{width:min(430px,100%);padding:24px;border-radius:var(--r);background:rgba(255,255,255,.78);border:1px solid var(--line);box-shadow:var(--shadow);display:grid;gap:16px;animation:floatIn .5s cubic-bezier(.2,.8,.2,1) both}.gate-card h2{font-size:1.8rem}.field{display:grid;gap:8px}.field label{color:var(--muted);font-size:.92rem}.field input{width:100%;height:48px;border-radius:var(--r);border:1px solid var(--line);background:rgba(255,255,255,.82);padding:0 14px;outline:none;transition:border-color .2s ease,box-shadow .2s ease}.field input:focus{border-color:rgba(255,125,146,.75);box-shadow:0 0 0 4px rgba(255,125,146,.13)}.primary{height:48px;border-radius:var(--r);background:linear-gradient(135deg,var(--rose),var(--peach));color:#fff;font-weight:800;box-shadow:0 14px 34px rgba(255,125,146,.28)}.toast{min-height:22px;color:#b84a60;font-size:.92rem}dialog{width:min(430px,calc(100% - 28px));border:1px solid var(--line);border-radius:var(--r);background:rgba(255,255,255,.92);box-shadow:var(--shadow);color:var(--ink);padding:0}dialog::backdrop{background:rgba(43,42,51,.24);backdrop-filter:blur(8px)}.dialog-inner{padding:18px;display:grid;gap:14px}.dialog-actions{display:flex;justify-content:end;gap:10px}#fileInput{display:none}.lightbox{position:fixed;inset:0;z-index:35;display:none;place-items:center;padding:24px;background:rgba(43,42,51,.68);backdrop-filter:blur(10px)}.lightbox.open{display:grid}.lightbox img{max-width:min(100%,1100px);max-height:84vh;object-fit:contain;border-radius:var(--r);box-shadow:0 28px 90px rgba(0,0,0,.34);animation:floatIn .28s ease both}.lightbox button{position:fixed;top:18px;right:18px}@keyframes floatIn{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}@media (max-width:900px){.stage{grid-template-columns:1fr}.album-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.photo-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media (max-width:620px){.app{width:min(100% - 18px,1180px);padding-top:12px}.topbar{align-items:flex-start}.brand{gap:9px}.mark{width:40px;height:40px}.actions{gap:8px}.pill-btn{width:42px;padding:0;justify-content:center}.pill-btn span:last-child{display:none}.hero{min-height:212px;padding:22px}.side{grid-template-columns:1fr 1fr}.meter strong{font-size:1.85rem}.album-grid{grid-template-columns:1fr}.album-view{padding:9px}.album-shell{max-height:calc(100vh - 18px)}.album-toolbar{align-items:flex-start}.photo-grid{grid-template-columns:repeat(2,minmax(0,1fr));padding:10px}.photo button{opacity:1}}
</style>
</head>
<body>
<main class="app" aria-hidden="true" id="app"><header class="topbar"><div class="brand"><div class="mark" aria-hidden="true"></div><div><h1>jziyy</h1><p class="subtle">小日子相簿</p></div></div><div class="actions"><button class="icon-btn" id="refreshBtn" title="刷新">↻</button><button class="pill-btn" id="newAlbumBtn" title="新相簿"><span>＋</span><span>新相簿</span></button></div></header><section class="stage"><div class="panel hero"><h2>把光放好</h2><p>那些不需要大声说明的瞬间，可以被安静地收在这里。</p></div><aside class="panel side"><div class="meter"><span>今日暗号</span><strong id="dayCode">--</strong></div><div class="meter"><span>已收集</span><strong id="photoCount">0</strong></div></aside></section><section><div class="albums-head"><h2>相簿</h2><p class="subtle" id="albumCount">0 本</p></div><div class="album-grid" id="albumGrid"></div></section></main>
<section class="gate" id="gate"><form class="gate-card" id="gateForm"><div><h2>今晚的门牌</h2><p class="subtle">输入那串会每天变化的小数字。</p></div><div class="field"><label for="passInput">暗号</label><input id="passInput" inputmode="numeric" autocomplete="off" required></div><button class="primary" type="submit">进去</button><p class="toast" id="gateToast" aria-live="polite"></p></form></section>
<section class="album-view" id="albumView" aria-hidden="true"><div class="panel album-shell"><div class="album-toolbar"><div><h2 id="openAlbumName"></h2><p class="subtle" id="openAlbumNote"></p></div><div class="actions"><button class="icon-btn" id="uploadBtn" title="上传照片">↑</button><button class="icon-btn" id="deleteAlbumBtn" title="删除相簿">⌫</button><button class="icon-btn" id="closeAlbumBtn" title="关闭">×</button></div></div><div class="photo-grid" id="photoGrid"></div></div></section>
<dialog id="albumDialog"><form class="dialog-inner" method="dialog" id="albumForm"><h2>新相簿</h2><div class="field"><label for="albumName">名字</label><input id="albumName" maxlength="28" required></div><div class="field"><label for="albumNote">一句话</label><input id="albumNote" maxlength="48"></div><div class="dialog-actions"><button class="ghost" value="cancel" type="button" id="cancelAlbumBtn">取消</button><button class="primary" value="default" type="submit">放好</button></div></form></dialog>
<div class="lightbox" id="lightbox"><button class="icon-btn" id="closeLightboxBtn" title="关闭">×</button><img id="lightboxImg" alt=""></div><input id="fileInput" type="file" accept="image/*" multiple>
<script>
const BASE_DATE={y:2025,m:8,d:10},DB_NAME="jziyy-album-db",DB_VERSION=1,STORE_NAME="state",STATE_KEY="albums",state={albums:[],openAlbumId:""},$=s=>document.querySelector(s),app=$("#app"),gate=$("#gate"),passInput=$("#passInput"),gateToast=$("#gateToast"),albumGrid=$("#albumGrid"),albumView=$("#albumView"),photoGrid=$("#photoGrid"),fileInput=$("#fileInput"),albumDialog=$("#albumDialog"),albumName=$("#albumName"),albumNote=$("#albumNote"),lightbox=$("#lightbox"),lightboxImg=$("#lightboxImg");function todayPassword(){const n=new Date,t=new Date(n.getFullYear(),n.getMonth(),n.getDate()),s=new Date(BASE_DATE.y,BASE_DATE.m-1,BASE_DATE.d);return String(Math.abs(Math.round((t-s)/864e5)))}function createId(){return crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random().toString(16).slice(2)}`}function openDb(){return new Promise((ok,bad)=>{const r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=()=>r.result.createObjectStore(STORE_NAME);r.onsuccess=()=>ok(r.result);r.onerror=()=>bad(r.error)})}async function readStoredState(){const db=await openDb;return new Promise((ok,bad)=>{const tx=db.transaction(STORE_NAME,"readonly"),r=tx.objectStore(STORE_NAME).get(STATE_KEY);r.onsuccess=()=>ok(r.result||null);r.onerror=()=>bad(r.error)})}async function saveStoredState(v){const db=await openDb();return new Promise((ok,bad)=>{const tx=db.transaction(STORE_NAME,"readwrite");tx.objectStore(STORE_NAME).put(v,STATE_KEY);tx.oncomplete=()=>ok();tx.onerror=()=>bad(tx.error)})}function defaultAlbums(){return[{id:createId(),name:"慢慢收集",note:"一些发光的小瞬间",createdAt:new Date().toISOString(),tone:"peach",photos:[]}]}async function loadState(){const saved=await readStoredState();state.albums=Array.isArray(saved?.albums)&&saved.albums.length?saved.albums:defaultAlbums();await saveStoredState({albums:state.albums});$("#dayCode").textContent=todayPassword();renderAlbums();renderCounters();if(state.openAlbumId)renderOpenAlbum()}async function persistAndRender(){await saveStoredState({albums:state.albums});renderAlbums();renderCounters();if(state.openAlbumId)renderOpenAlbum()}function toneStyle(t){return{peach:"linear-gradient(135deg,#ffbc8b,#ff7d92)",mint:"linear-gradient(135deg,#8edfc1,#8fc7ff)",sky:"linear-gradient(135deg,#8fc7ff,#ffd17d)",berry:"linear-gradient(135deg,#c49aff,#ff9bb0)"}[t]||"linear-gradient(135deg,#ffbc8b,#ff7d92)"}function renderCounters(){const p=state.albums.reduce((s,a)=>s+a.photos.length,0);$("#photoCount").textContent=p;$("#albumCount").textContent=`${state.albums.length} 本`}function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}function renderAlbums(){albumGrid.innerHTML="";for(const album of state.albums){const cover=album.photos[0]?.dataUrl||"",card=document.createElement("button");card.className="album-card";card.type="button";card.style.setProperty("--tone",toneStyle(album.tone));card.innerHTML=`<div class="cover">${cover?`<img src="${cover}" alt="">`:`<div class="empty-shape">✦</div>`}</div><div><div class="album-title"><h3>${escapeHtml(album.name)}</h3><span>${album.photos.length} 张</span></div><p class="album-note">${escapeHtml(album.note||"一些很好很轻的片刻")}</p></div>`;card.addEventListener("click",()=>openAlbum(album.id));albumGrid.appendChild(card)}}function openAlbum(id){state.openAlbumId=id;const show=()=>{renderOpenAlbum();albumView.classList.add("open");albumView.setAttribute("aria-hidden","false")};document.startViewTransition?document.startViewTransition(show):show()}function closeAlbum(){albumView.classList.remove("open");albumView.setAttribute("aria-hidden","true");setTimeout(()=>{if(!albumView.classList.contains("open"))state.openAlbumId=""},260)}function renderOpenAlbum(){const album=state.albums.find(i=>i.id===state.openAlbumId);if(!album)return;$("#openAlbumName").textContent=album.name;$("#openAlbumNote").textContent=album.note||`${album.photos.length} 张照片`;photoGrid.innerHTML="";if(!album.photos.length){photoGrid.innerHTML='<div class="empty">还空着。<br>先放进第一张照片。</div>';return}album.photos.forEach((photo,index)=>{const item=document.createElement("div");item.className="photo";item.style.animationDelay=`${Math.min(index*35,420)}ms`;item.innerHTML=`<img src="${photo.dataUrl}" alt=""><button title="删除照片" aria-label="删除照片">×</button>`;item.querySelector("img").addEventListener("click",()=>{lightboxImg.src=photo.dataUrl;lightbox.classList.add("open")});item.querySelector("button").addEventListener("click",async e=>{e.stopPropagation();if(!confirm("删除这张照片？"))return;album.photos=album.photos.filter(i=>i.id!==photo.id);await persistAndRender()});photoGrid.appendChild(item)})}async function compressImage(file){const bitmap=await createImageBitmap(file),max=1800,scale=Math.min(1,max/Math.max(bitmap.width,bitmap.height)),canvas=document.createElement("canvas");canvas.width=Math.round(bitmap.width*scale);canvas.height=Math.round(bitmap.height*scale);canvas.getContext("2d").drawImage(bitmap,0,0,canvas.width,canvas.height);return canvas.toDataURL("image/jpeg",.86)}async function uploadFiles(files){const album=state.albums.find(i=>i.id===state.openAlbumId);if(!album||!files.length)return;$("#uploadBtn").textContent="…";try{for(const file of files){if(!file.type.startsWith("image/"))continue;album.photos.unshift({id:createId(),name:file.name,dataUrl:await compressImage(file),createdAt:new Date().toISOString()})}await persistAndRender()}finally{$("#uploadBtn").textContent="↑";fileInput.value=""}}$("#gateForm").addEventListener("submit",async e=>{e.preventDefault();gateToast.textContent="";if(passInput.value.trim()!==todayPassword()){gateToast.textContent="门牌好像不对。";passInput.select();return}await loadState();gate.style.display="none";app.removeAttribute("aria-hidden")});$("#newAlbumBtn").addEventListener("click",()=>{albumName.value="";albumNote.value="";albumDialog.showModal();setTimeout(()=>albumName.focus(),60)});$("#albumForm").addEventListener("submit",async e=>{e.preventDefault();state.albums.unshift({id:createId(),name:albumName.value.trim(),note:albumNote.value.trim(),createdAt:new Date().toISOString(),tone:["peach","mint","sky","berry"][state.albums.length%4],photos:[]});await persistAndRender();albumDialog.close()});$("#cancelAlbumBtn").addEventListener("click",()=>albumDialog.close());$("#refreshBtn").addEventListener("click",loadState);$("#closeAlbumBtn").addEventListener("click",closeAlbum);$("#uploadBtn").addEventListener("click",()=>fileInput.click());fileInput.addEventListener("change",()=>uploadFiles([...fileInput.files]));$("#closeLightboxBtn").addEventListener("click",()=>lightbox.classList.remove("open"));lightbox.addEventListener("click",e=>{if(e.target===lightbox)lightbox.classList.remove("open")});$("#deleteAlbumBtn").addEventListener("click",async()=>{const album=state.albums.find(i=>i.id===state.openAlbumId);if(!album||!confirm(`删除「${album.name}」？`))return;state.albums=state.albums.filter(i=>i.id!==album.id);if(!state.albums.length)state.albums=defaultAlbums();closeAlbum();await persistAndRender()});
</script>
</body>
