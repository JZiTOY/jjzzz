<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>jziyy | 小日子相簿</title>
<style>
:root{--ink:#302b35;--muted:#716b77;--line:rgba(48,43,53,.14);--rose:#ff7d92;--peach:#ffbd8f;--mint:#8edfc1;--sky:#8fc7ff;--paper:rgba(255,252,247,.84);--r:8px;--shadow:0 24px 70px rgba(80,58,80,.16);font-family:"Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);background:radial-gradient(circle at 14% 18%,rgba(255,189,143,.46),transparent 24rem),radial-gradient(circle at 86% 8%,rgba(142,223,193,.42),transparent 28rem),radial-gradient(circle at 68% 86%,rgba(143,199,255,.32),transparent 25rem),linear-gradient(135deg,#fff8ee,#fff1f6 52%,#effaf5);overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.48;background-image:linear-gradient(120deg,rgba(255,255,255,.32) 0 1px,transparent 1px 22px),radial-gradient(circle,rgba(255,255,255,.82) 0 1px,transparent 1.5px);background-size:36px 36px,28px 28px;mask-image:linear-gradient(to bottom,#000,transparent 85%)}h1,h2,h3,p{margin:0}button,input{font:inherit}button{border:0;cursor:pointer;color:inherit}.app{width:min(1180px,calc(100% - 28px));margin:0 auto;padding:20px 0 44px;position:relative}.app[aria-hidden=true]{visibility:hidden}.top{min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:12px}.mark{width:48px;height:48px;border-radius:50%;background:radial-gradient(circle at 34% 30%,#fff 0 13%,transparent 14%),conic-gradient(from 140deg,var(--rose),var(--peach),var(--mint),var(--sky),var(--rose));box-shadow:0 14px 28px rgba(255,125,146,.24)}h1{font-size:clamp(1.35rem,3vw,2.2rem);letter-spacing:0}.muted{color:var(--muted);font-size:.94rem;margin-top:6px}.actions{display:flex;align-items:center;justify-content:flex-end;gap:10px;flex-wrap:wrap}.icon,.pill,.ghost{height:42px;border-radius:var(--r);background:rgba(255,255,255,.7);border:1px solid var(--line);box-shadow:0 12px 34px rgba(70,62,74,.1);transition:transform .2s,background .2s,box-shadow .2s}.icon{width:42px;display:grid;place-items:center;font-size:1.25rem}.pill,.ghost{padding:0 15px;font-weight:700}.icon:hover,.pill:hover,.ghost:hover{transform:translateY(-2px);background:rgba(255,255,255,.94);box-shadow:0 16px 42px rgba(70,62,74,.14)}.stage{margin-top:24px;display:grid;grid-template-columns:1fr 330px;gap:18px}.panel{border:1px solid var(--line);background:var(--paper);backdrop-filter:blur(18px);border-radius:var(--r);box-shadow:var(--shadow)}.hero{min-height:250px;padding:clamp(22px,5vw,44px);position:relative;overflow:hidden;display:grid;align-content:end}.hero:after{content:"";position:absolute;inset:auto -6% -18% 36%;height:180px;background:linear-gradient(90deg,rgba(255,125,146,.18),transparent 72%),repeating-linear-gradient(92deg,rgba(43,42,51,.13) 0 1px,transparent 1px 18px);transform:rotate(-5deg);border-radius:50%}.hero h2{max-width:8ch;font-size:clamp(2.2rem,8vw,6.6rem);line-height:.9;letter-spacing:0;position:relative;z-index:1}.hero p{max-width:36rem;margin-top:16px;color:var(--muted);line-height:1.8;position:relative;z-index:1}.side{padding:18px;display:grid;gap:14px}.meter{min-height:116px;padding:18px;border-radius:var(--r);background:linear-gradient(135deg,rgba(255,125,146,.18),rgba(142,223,193,.2)),rgba(255,255,255,.46);display:grid;align-content:space-between}.meter strong{font-size:2.4rem;line-height:1}.head{margin:28px 0 14px;display:flex;align-items:center;justify-content:space-between}.albums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.album{min-height:254px;padding:12px;border-radius:var(--r);background:rgba(255,255,255,.72);border:1px solid var(--line);box-shadow:0 15px 45px rgba(70,62,74,.1);display:grid;grid-template-rows:1fr auto;gap:12px;text-align:left;transition:transform .28s cubic-bezier(.2,.8,.2,1),box-shadow .28s}.album:hover{transform:translateY(-5px) rotate(-.5deg);box-shadow:0 24px 58px rgba(70,62,74,.16)}.cover{min-height:164px;border-radius:var(--r);overflow:hidden;position:relative;background:linear-gradient(135deg,rgba(255,255,255,.5),transparent),var(--tone)}.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .45s}.album:hover img{transform:scale(1.05)}.emptyMark{position:absolute;inset:18px;border:1px solid rgba(255,255,255,.72);border-radius:var(--r);display:grid;place-items:center;color:rgba(43,42,51,.58);font-size:2rem}.row{display:flex;align-items:end;justify-content:space-between;gap:10px}.row h3{font-size:1.08rem;overflow-wrap:anywhere}.row span,.note{color:var(--muted);font-size:.9rem}.note{margin-top:5px;overflow-wrap:anywhere}.gate{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:18px;background:radial-gradient(circle at 18% 20%,rgba(255,125,146,.34),transparent 24rem),radial-gradient(circle at 82% 10%,rgba(142,223,193,.4),transparent 24rem),linear-gradient(135deg,#fff7ef,#fff2f7 58%,#eefaf4)}.gateCard{width:min(430px,100%);padding:24px;border-radius:var(--r);background:rgba(255,255,255,.78);border:1px solid var(--line);box-shadow:var(--shadow);display:grid;gap:16px;animation:in .5s cubic-bezier(.2,.8,.2,1) both}.field{display:grid;gap:8px}.field label{color:var(--muted);font-size:.92rem}.field input{width:100%;height:48px;border-radius:var(--r);border:1px solid var(--line);background:rgba(255,255,255,.82);padding:0 14px;outline:none}.field input:focus{border-color:rgba(255,125,146,.75);box-shadow:0 0 0 4px rgba(255,125,146,.13)}.primary{height:48px;border-radius:var(--r);background:linear-gradient(135deg,var(--rose),var(--peach));color:#fff;font-weight:800;box-shadow:0 14px 34px rgba(255,125,146,.28)}.toast{min-height:22px;color:#b84a60;font-size:.92rem}.view{position:fixed;inset:0;z-index:20;padding:22px;background:rgba(255,248,244,.72);backdrop-filter:blur(18px);display:grid;opacity:0;pointer-events:none;transition:opacity .28s}.view.open{opacity:1;pointer-events:auto}.shell{width:min(1080px,100%);max-height:calc(100vh - 44px);margin:auto;overflow:hidden;display:grid;grid-template-rows:auto 1fr;transform:translateY(22px) scale(.98);transition:transform .42s cubic-bezier(.2,.8,.2,1)}.view.open .shell{transform:translateY(0) scale(1)}.toolbar{padding:14px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}.grid{padding:14px;overflow:auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.photo{aspect-ratio:1;border-radius:var(--r);overflow:hidden;background:#fff;position:relative;opacity:0;animation:in .46s cubic-bezier(.2,.8,.2,1) forwards;box-shadow:0 10px 30px rgba(70,62,74,.1)}.photo img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s}.photo:hover img{transform:scale(1.06)}.photo button{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.8);opacity:0}.photo:hover button{opacity:1}.empty{grid-column:1/-1;min-height:230px;border:1px dashed rgba(43,42,51,.18);border-radius:var(--r);display:grid;place-items:center;color:var(--muted);text-align:center;line-height:1.8}dialog{width:min(430px,calc(100% - 28px));border:1px solid var(--line);border-radius:var(--r);background:rgba(255,255,255,.92);box-shadow:var(--shadow);padding:0}dialog::backdrop{background:rgba(43,42,51,.24);backdrop-filter:blur(8px)}.dialogInner{padding:18px;display:grid;gap:14px}.dialogActions{display:flex;justify-content:end;gap:10px}#fileInput{display:none}.lightbox{position:fixed;inset:0;z-index:35;display:none;place-items:center;padding:24px;background:rgba(43,42,51,.68);backdrop-filter:blur(10px)}.lightbox.open{display:grid}.lightbox img{max-width:min(100%,1100px);max-height:84vh;object-fit:contain;border-radius:var(--r);box-shadow:0 28px 90px rgba(0,0,0,.34)}.lightbox button{position:fixed;top:18px;right:18px}@keyframes in{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}@media(max-width:900px){.stage{grid-template-columns:1fr}.albums{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:620px){.app{width:min(100% - 18px,1180px);padding-top:12px}.top{align-items:flex-start}.mark{width:40px;height:40px}.pill{width:42px;padding:0}.pill span:last-child{display:none}.hero{min-height:212px;padding:22px}.side{grid-template-columns:1fr 1fr}.meter strong{font-size:1.85rem}.albums{grid-template-columns:1fr}.view{padding:9px}.shell{max-height:calc(100vh - 18px)}.toolbar{align-items:flex-start}.grid{grid-template-columns:repeat(2,minmax(0,1fr));padding:10px}.photo button{opacity:1}}
</style>
</head>
<body>
<main class="app" aria-hidden="true" id="app"><header class="top"><div class="brand"><div class="mark"></div><div><h1>jziyy</h1><p class="muted">小日子相簿</p></div></div><div class="actions"><button class="icon" id="refresh" title="刷新">↻</button><button class="pill" id="newAlbum" title="新相簿"><span>＋</span><span>新相簿</span></button></div></header><section class="stage"><div class="panel hero"><h2>把光放好</h2><p>那些不需要大声说明的瞬间，可以被安静地收在这里。</p></div><aside class="panel side"><div class="meter"><span>今日暗号</span><strong id="dayCode">--</strong></div><div class="meter"><span>已收集</span><strong id="photoCount">0</strong></div></aside></section><section><div class="head"><h2>相簿</h2><p class="muted" id="albumCount">0 本</p></div><div class="albums" id="albums"></div></section></main>
<section class="gate" id="gate"><form class="gateCard" id="gateForm"><div><h2>今晚的门牌</h2><p class="muted">输入那串会每天变化的小数字。</p></div><div class="field"><label for="pass">暗号</label><input id="pass" inputmode="numeric" autocomplete="off" required></div><button class="primary">进去</button><p class="toast" id="toast"></p></form></section>
<section class="view" id="view"><div class="panel shell"><div class="toolbar"><div><h2 id="openName"></h2><p class="muted" id="openNote"></p></div><div class="actions"><button class="icon" id="upload" title="上传照片">↑</button><button class="icon" id="deleteAlbum" title="删除相簿">⌫</button><button class="icon" id="close" title="关闭">×</button></div></div><div class="grid" id="photos"></div></div></section>
<dialog id="dialog"><form class="dialogInner" id="albumForm" method="dialog"><h2>新相簿</h2><div class="field"><label for="albumName">名字</label><input id="albumName" maxlength="28" required></div><div class="field"><label for="albumNote">一句话</label><input id="albumNote" maxlength="48"></div><div class="dialogActions"><button class="ghost" type="button" id="cancel">取消</button><button class="primary">放好</button></div></form></dialog>
<div class="lightbox" id="lightbox"><button class="icon" id="closeLight" title="关闭">×</button><img id="big" alt=""></div><input id="fileInput" type="file" accept="image/*" multiple>
<script>
const START=new Date(2025,7,10),DB="jziyy-album-db-v2",STORE="state",KEY="albums",tones=["linear-gradient(135deg,#ffbc8b,#ff7d92)","linear-gradient(135deg,#8edfc1,#8fc7ff)","linear-gradient(135deg,#8fc7ff,#ffd17d)","linear-gradient(135deg,#c49aff,#ff9bb0)"],S={albums:[],open:""},$=s=>document.querySelector(s);function pwd(){let n=new Date,t=new Date(n.getFullYear(),n.getMonth(),n.getDate());return String(Math.abs(Math.round((t-START)/864e5)))}function id(){return crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random().toString(16).slice(2)}function db(){return new Promise((ok,bad)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>ok(r.result);r.onerror=()=>bad(r.error)})}async function loadRaw(){let d=await db();return new Promise((ok,bad)=>{let r=d.transaction(STORE,"readonly").objectStore(STORE).get(KEY);r.onsuccess=()=>ok(r.result);r.onerror=()=>bad(r.error)})}async function save(){let d=await db();return new Promise((ok,bad)=>{let tx=d.transaction(STORE,"readwrite");tx.objectStore(STORE).put({albums:S.albums},KEY);tx.oncomplete=ok;tx.onerror=()=>bad(tx.error)})}function starter(){return[{id:id(),name:"慢慢收集",note:"一些发光的小瞬间",tone:0,photos:[],createdAt:new Date().toISOString()}]}async function load(){let raw=await loadRaw();S.albums=Array.isArray(raw?.albums)&&raw.albums.length?raw.albums:starter();await save();$("#dayCode").textContent=pwd();render()}function esc(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}function render(){let total=S.albums.reduce((a,b)=>a+b.photos.length,0);$("#photoCount").textContent=total;$("#albumCount").textContent=S.albums.length+" 本";let box=$("#albums");box.innerHTML="";S.albums.forEach(a=>{let cover=a.photos[0]?.src||"",b=document.createElement("button");b.className="album";b.style.setProperty("--tone",tones[a.tone%tones.length]);b.innerHTML=`<div class="cover">${cover?`<img src="${cover}" alt="">`:`<div class="emptyMark">✦</div>`}</div><div><div class="row"><h3>${esc(a.name)}</h3><span>${a.photos.length} 张</span></div><p class="note">${esc(a.note||"一些很好很轻的片刻")}</p></div>`;b.onclick=()=>openAlbum(a.id);box.appendChild(b)});if(S.open)renderOpen()}function openAlbum(albumId){S.open=albumId;let show=()=>{$("#view").classList.add("open");renderOpen()};document.startViewTransition?document.startViewTransition(show):show()}function renderOpen(){let a=S.albums.find(x=>x.id===S.open);if(!a)return;$("#openName").textContent=a.name;$("#openNote").textContent=a.note||a.photos.length+" 张照片";let g=$("#photos");g.innerHTML="";if(!a.photos.length){g.innerHTML='<div class="empty">还空着。<br>先放进第一张照片。</div>';return}a.photos.forEach((p,i)=>{let item=document.createElement("div");item.className="photo";item.style.animationDelay=Math.min(i*35,420)+"ms";item.innerHTML=`<img src="${p.src}" alt=""><button title="删除照片">×</button>`;item.querySelector("img").onclick=()=>{$("#big").src=p.src;$("#lightbox").classList.add("open")};item.querySelector("button").onclick=async e=>{e.stopPropagation();if(confirm("删除这张照片？")){a.photos=a.photos.filter(x=>x.id!==p.id);await save();render()}};g.appendChild(item)})}function closeAlbum(){S.open="";$("#view").classList.remove("open")}async function shrink(file){let img=await createImageBitmap(file),max=1800,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext("2d").drawImage(img,0,0,c.width,c.height);return c.toDataURL("image/jpeg",.86)}async function addFiles(files){let a=S.albums.find(x=>x.id===S.open);if(!a)return;$("#upload").textContent="…";try{for(let f of files){if(f.type.startsWith("image/"))a.photos.unshift({id:id(),name:f.name,src:await shrink(f),createdAt:new Date().toISOString()})}await save();render()}finally{$("#upload").textContent="↑";$("#fileInput").value=""}}$("#gateForm").onsubmit=async e=>{e.preventDefault();$("#toast").textContent="";if($("#pass").value.trim()!==pwd()){$("#toast").textContent="门牌好像不对。";$("#pass").select();return}await load();$("#gate").style.display="none";$("#app").removeAttribute("aria-hidden")};$("#newAlbum").onclick=()=>{$("#albumName").value="";$("#albumNote").value="";$("#dialog").showModal();setTimeout(()=>$("#albumName").focus(),60)};$("#albumForm").onsubmit=async e=>{e.preventDefault();S.albums.unshift({id:id(),name:$("#albumName").value.trim(),note:$("#albumNote").value.trim(),tone:S.albums.length%tones.length,photos:[],createdAt:new Date().toISOString()});await save();render();$("#dialog").close()};$("#cancel").onclick=()=>$("#dialog").close();$("#refresh").onclick=load;$("#close").onclick=closeAlbum;$("#upload").onclick=()=>$("#fileInput").click();$("#fileInput").onchange=()=>addFiles([...$("#fileInput").files]);$("#closeLight").onclick=()=>$("#lightbox").classList.remove("open");$("#lightbox").onclick=e=>{if(e.target.id==="lightbox")$("#lightbox").classList.remove("open")};$("#deleteAlbum").onclick=async()=>{let a=S.albums.find(x=>x.id===S.open);if(a&&confirm(`删除「${a.name}」？`)){S.albums=S.albums.filter(x=>x.id!==a.id);if(!S.albums.length)S.albums=starter();closeAlbum();await save();render()}};
</script>
</body>
</html>
