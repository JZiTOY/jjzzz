<main class="wrap" id="app" aria-hidden="true"><header class="top"><div class="brand"><div class="logo"></div><div><h1>jziyy</h1><p class="muted">&#20113;&#31471;&#23567;&#26085;&#23376;&#30456;&#31807;</p></div></div><button class="btn" id="new">+ &#26032;&#30456;&#31807;</button></header><section class="hero"><div class="panel headline"><h2>&#25226;&#20809;&#25918;&#22909;</h2><p>&#37027;&#20123;&#19981;&#38656;&#35201;&#22823;&#22768;&#35828;&#26126;&#30340;&#30636;&#38388;&#65292;&#21487;&#20197;&#34987;&#23433;&#38745;&#22320;&#25910;&#22312;&#36825;&#37324;&#12290;</p></div><aside class="panel side"><div class="meter"><span>&#20170;&#26085;&#26263;&#21495;</span><strong id="code">--</strong></div><div class="meter"><span>&#24050;&#25910;&#38598;</span><strong id="count">0</strong></div></aside></section><section><div class="head"><h2>&#30456;&#31807;</h2><button class="icon" id="refresh">R</button></div><div class="albums" id="albums"></div></section></main>

<script>
const URL='https://agztjeifmpsbjtzjxrqg.supabase.co',KEY='sb_publishable_QijHcOpHj8mym96pb78osg_H9eOARSL',BUCKET='jziyy-photos',START=new Date(2025,7,10),$=s=>document.querySelector(s),S={albums:[],open:''};
function code(){let n=new Date,t=new Date(n.getFullYear(),n.getMonth(),n.getDate());return String(Math.abs(Math.round((t-START)/864e5)))}
function ok(v){v=String(v||'').trim();return v===code()||v==='288'||v==='289'}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function h(extra={}){return {apikey:KEY,Authorization:'Bearer '+KEY,...extra}}
async function api(path,opt={}){let r=await fetch(URL+path,{...opt,headers:{...h({'Content-Type':'application/json'}),...(opt.headers||{})}}),txt=await r.text();if(!r.ok)throw new Error(txt||r.status);return txt?JSON.parse(txt):null}
function pub(p){return URL+'/storage/v1/object/public/'+BUCKET+'/'+p}
async function load(){$('#code').textContent=code();let data=await api('/rest/v1/albums?select=id,name,note,tone,created_at,photos(id,name,path,created_at)&order=created_at.desc');S.albums=(data||[]).map(a=>({...a,photos:(a.photos||[]).sort((x,y)=>String(y.created_at).localeCompare(String(x.created_at))).map(p=>({...p,src:pub(p.path)}))}));if(!S.albums.length){await album('\u6162\u6162\u6536\u96c6','\u4e00\u4e9b\u53d1\u5149\u7684\u5c0f\u77ac\u95f4');return load()}render()}
function render(){let total=S.albums.reduce((n,a)=>n+a.photos.length,0);$('#count').textContent=total;let box=$('#albums');box.innerHTML='';S.albums.forEach(a=>{let b=document.createElement('button'),cover=a.photos[0]?.src||'';b.className='album';b.innerHTML='<div class="cover">'+(cover?'<img src="'+cover+'">':'<div class="empty">*</div>')+'</div><div><div class="row"><h3>'+esc(a.name)+'</h3><span>'+a.photos.length+' \u5f20</span></div><p class="note">'+esc(a.note||'\u4e00\u4e9b\u5f88\u597d\u5f88\u8f7b\u7684\u7247\u523b')+'</p></div>';b.onclick=()=>openA(a.id);box.appendChild(b)});if(S.open)renderOpen()}
function openA(id){S.open=id;$('#view').classList.add('open');renderOpen()}
function renderOpen(){let a=S.albums.find(x=>x.id===S.open);if(!a)return;$('#openName').textContent=a.name;$('#openNote').textContent=a.note||a.photos.length+' \u5f20\u7167\u7247';let g=$('#photos');g.innerHTML='';if(!a.photos.length){g.innerHTML='<div class="empty">\u8fd8\u7a7a\u7740\u3002<br>\u5148\u653e\u8fdb\u7b2c\u4e00\u5f20\u7167\u7247\u3002</div>';return}a.photos.forEach(p=>{let d=document.createElement('div');d.className='photo';d.innerHTML='<img src="'+p.src+'"><button>X</button>';d.querySelector('img').onclick=()=>{$('#big').src=p.src;$('#light').classList.add('open')};d.querySelector('button').onclick=async e=>{e.stopPropagation();if(!confirm('\u5220\u9664\u8fd9\u5f20\u7167\u7247\uff1f'))return;await storageDelete(p.path);await api('/rest/v1/photos?id=eq.'+p.id,{method:'DELETE'});await load()};g.appendChild(d)})}
async function album(name,note){await api('/rest/v1/albums',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({name,note,tone:S.albums.length%4})})}
async function shrink(f){let img=await createImageBitmap(f),m=1800,s=Math.min(1,m/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return new Promise(o=>c.toBlob(o,'image/jpeg',.86))}
async function storageUpload(path,blob){let r=await fetch(URL+'/storage/v1/object/'+BUCKET+'/'+path,{method:'POST',headers:h({'Content-Type':'image/jpeg'}),body:blob}),txt=await r.text();if(!r.ok)throw new Error(txt||r.status)}
async function storageDelete(path){await fetch(URL+'/storage/v1/object/'+BUCKET,{method:'DELETE',headers:h({'Content-Type':'application/json'}),body:JSON.stringify({prefixes:[path]})})}
async function add(files){let a=S.albums.find(x=>x.id===S.open);if(!a)return;$('#upload').textContent='...';try{for(let f of files){if(!f.type.startsWith('image/'))continue;let blob=await shrink(f),path=a.id+'/'+Date.now()+'-'+Math.random().toString(16).slice(2)+'.jpg';await storageUpload(path,blob);await api('/rest/v1/photos',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({album_id:a.id,name:f.name,path})})}await load()}finally{$('#upload').textContent='U';$('#file').value=''}}
$('#login').onsubmit=async e=>{e.preventDefault();$('#toast').textContent='';if(!ok($('#pass').value)){$('#toast').textContent='\u95e8\u724c\u597d\u50cf\u4e0d\u5bf9\uff0c\u8bd5\u8bd5 288\u3002';return}try{await load();$('#gate').style.display='none';$('#app').removeAttribute('aria-hidden')}catch(err){$('#toast').textContent='\u4e91\u7aef\u8fde\u63a5\u5931\u8d25\uff1a'+(err.message||err)}};
$('#new').onclick=()=>{$('#albumName').value='';$('#albumNote').value='';$('#dialog').showModal()};$('#albumForm').onsubmit=async e=>{e.preventDefault();await album($('#albumName').value.trim(),$('#albumNote').value.trim());$('#dialog').close();await load()};$('#cancel').onclick=()=>$('#dialog').close();$('#refresh').onclick=load;$('#close').onclick=()=>{S.open='';$('#view').classList.remove('open')};$('#upload').onclick=()=>$('#file').click();$('#file').onchange=()=>add([...$('#file').files]);$('#closeLight').onclick=()=>$('#light').classList.remove('open');$('#light').onclick=e=>{if(e.target.id==='light')$('#light').classList.remove('open')};$('#delAlbum').onclick=async()=>{let a=S.albums.find(x=>x.id===S.open);if(!a||!confirm('\u5220\u9664\u300c'+a.name+'\u300d\uff1f'))return;for(let p of a.photos)await storageDelete(p.path);await api('/rest/v1/albums?id=eq.'+a.id,{method:'DELETE'});S.open='';$('#view').classList.remove('open');await load()};
</script>
