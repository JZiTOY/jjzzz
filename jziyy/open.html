<style>

;border-radius:8px;box-shadow:0 15px 42px #463e4a18;display:grid;grid-template-rows:1fr auto;gap:12px;transition:.25s}.album:hover{transform:translateY(-4px)}.cover{min-height:158px;border-radius:8px;overflow:hidden;position:relative;background:linear-gradient(135deg,#ffbc8b,#8edfc1)}.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.empty{border:1px dashed #302b3530;border-radius:8px;min-height:220px;display:grid;place-items:center;text-align:center;color:#746d78;line-height:1.8;padding:20px}.row{display:flex;justify-content:space-between;gap:10px}.note,.row span{color:#746d78;font-size:.92rem}.gate{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:18px;background:linear-gradient(135deg,#fff7ef,#fff2f7 58%,#eefaf4)}.card{width:min(430px,100%);padding:24px;background:#ffffffd0;border:1px solid #302b3520;border-radius:8px;box-shadow:0 24px 70px #503a5026;display:grid;gap:16px}.field{display:grid;gap:8px}.field input{height:48px;border-radius:8px;border:1px solid #302b3520;padding:0 14px;background:#fff}.primary{height:48px;border-radius:8px;background:linear-gradient(135deg,var(--r),var(--p));color:white;font-weight:800}.toast{min-height:22px;color:#b84a60}.view{position:fixed;inset:0;z-index:6;background:#fff8f4bf;backdrop-filter:blur(16px);display:none;padding:18px}.view.open{display:grid}.shell{width:min(1080px,100%);max-height:calc(100vh - 36px);margin:auto;display:grid;grid-template-rows:auto 1fr;overflow:hidden}.bar{padding:14px;display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #302b3520}.photos{padding:12px;overflow:auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.photo{aspect-ratio:1;border-radius:8px;overflow:hidden;position:relative;background:white}.photo img{width:100%;height:100%;object-fit:cover}.photo button{position:absolute;right:8px;top:8px;width:32px;height:32px;border-radius:50%;background:#ffffffd0}.light{position:fixed;inset:0;z-index:8;display: </style></head><body>
<main class="wrap" id="app" aria-hidden="true"><header class="top"><div class="brand"><div class="logo"></div><div><h1>jziyy</h1><p class="muted">云端小日子相簿</p></div></div><button class="btn" id="new"><span>＋</span><span>新相簿</span></button></header><section class="hero"><div class="panel headline"><h2>把光放好</h2><p>那些不需要大声说明的瞬间，可以被安静地收在这里。</p></div><aside class="panel side"><div class="meter"><span>今日暗号</span><strong id="code">--</strong></div><div class="meter"><span>已收集</span><strong id="count">0</strong></div></aside></section><section><div class="head"><h2>相簿</h2><button class="icon" id="refresh">↻</button></div><div class="albums" id="albums"></div></section></main>
<section class="gate" id="gate"><form class="card" id="login"><div><h2>今晚的门牌</h2><p class="muted">输入那串会每天变化的小数字。</p></div><div class="field"><label for="pass">暗号</label><input id="pass" inputmode="numeric" autocomplete="off" required></div><button class="primary">进去</button><p class="toast" id="toast"></p></form></section>
<section class="view" id="view"><div class="panel shell"><div class="bar"><div><h2 id="openName"></h2><p class="muted" id="openNote"></p></div><div><button class="icon" id="upload">↑</button><button class="icon" id="delAlbum">⌫</button><button class="icon" id="close">×</button></div></div><div class="photos" id="photos"></div></div></section>
<dialog id="dialog"><form class="dialog" id="albumForm" method="dialog"><h2>新相簿</h2><div class="field"><label>名字</label><input id="albumName" maxlength="28" required></div><div class="field"><label>一句话</label><input id="albumNote" maxlength="48"></div><div class="actions"><button class="btn" type="button" id="cancel">取消</button><button class="primary">放好</button></div></form></dialog>
<div class="light" id="light"><button class="icon" id="closeLight">×</button><img id="big"></div><input id="file" type="file" accept="image/*" multiple>
<script>
const URL='https://agztjeifmpsbjtzjxrqg.supabase.co',KEY='sb_publishable_QijHcOpHj8mym96pb78osg_H9eOARSL',BUCKET='jziyy-photos',START=new Date(2025,7,10),$=s=>document.querySelector(s),C=window.supabase.createClient(URL,KEY),S={albums:[],open:''};function code(){let n=new Date,t=new Date(n.getFullYear(),n.getMonth(),n.getDate());return String(Math.abs(Math.round((t-START)/864e5)))}function ok(v){v=String(v||'').trim();return v===code()||v==='288'||v==='289'}function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function pub(p){return C.storage.from(BUCKET).getPublicUrl(p).data.publicUrl}async function load(){ $('#code').textContent=code();let q=await C.from('albums').select('id,name,note,tone,created_at,photos(id,name,path,created_at)').order('created_at',{ascending:false});if(q.error)throw q.error;S.albums=(q.data||[]).map(a=>({...a,photos:(a.photos||[]).sort((x,y)=>String(y.created_at).localeCompare(String(x.created_at))).map(p=>({...p,src:pub(p.path)}))}));if(!S.albums.length){await album('慢慢收集','一些发光的小瞬间');return load()}render()}function render(){let total=S.albums.reduce((n,a)=>n+a.photos.length,0);$('#count').textContent=total;let box=$('#albums');box.innerHTML='';S.albums.forEach(a=>{let b=document.createElement('button'),cover=a.photos[0]?.src||'';b.className='album';b.innerHTML=`<div class="cover">${cover?`<img src="${cover}">`:'<div class="empty">✦</div>'}</div><div><div class="row"><h3>${esc(a.name)}</h3><span>${a.photos.length} 张</span></div><p class="note">${esc(a.note||'一些很好很轻的片刻')}</p></div>`;b.onclick=()=>openA(a.id);box.appendChild(b)});if(S.open)renderOpen()}function openA(id){S.open=id;$('#view').classList.add('open');renderOpen()}function renderOpen(){let a=S.albums.find(x=>x.id===S.open);if(!a)return;$('#openName').textContent=a.name;$('#openNote').textContent=a.note||a.photos.length+' 张照片';let g=$('#photos');g.innerHTML='';if(!a.photos.length){g.innerHTML='<div class="empty">还空着。<br>先放进第一张照片。</div>';return}a.photos.forEach(p=>{let d=document.createElement('div');d.className='photo';d.innerHTML=`<img src="${p.src}"><button>×</button>`;d.querySelector('img').onclick=()=>{$('#big').src=p.src;$('#light').classList.add('open')};d.querySelector('button').onclick=async e=>{e.stopPropagation();if(!confirm('删除这张照片？'))return;await C.storage.from(BUCKET).remove([p.path]);let r=await C.from('photos').delete().eq('id',p.id);if(r.error)throw r.error;await load()};g.appendChild(d)})}async function album(name,note){let r=await C.from('albums').insert({name,note,tone:S.albums.length%4});if(r.error)throw r.error}async function shrink(f){let img=await createImageBitmap(f),m=1800,s=Math.min(1,m/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return new Promise(o=>c.toBlob(o,'image/jpeg',.86))}async function add(files){let a=S.albums.find(x=>x.id===S.open);if(!a)return;$('#upload').textContent='…';try{for(let f of files){if(!f.type.startsWith('image/'))continue;let blob=await shrink(f),path=`${a.id}/${Date.now()}-${Math.random().toString(16).slice(2)}.jpg`,u=await C.storage.from(BUCKET).upload(path,blob,{contentType:'image/jpeg'});if(u.error)throw u.error;let r=await C.from('photos').insert({album_id:a.id,name:f.name,path});if(r.error)throw r.error}await load()}finally{$('#upload').textContent='↑';$('#file').value=''}}$('#login').onsubmit=async e=>{e.preventDefault();$('#toast').textContent='';if(!ok($('#pass').value)){$('#toast').textContent='门牌好像不对。可试 288 或刷新页面。';return}try{await load();$('#gate').style.display='none';$('#app').removeAttribute('aria-hidden')}catch(err){$('#toast').textContent='云端连接失败：'+(err.message||err)}};$('#new').onclick=()=>{$('#albumName').value='';$('#albumNote').value='';$('#dialog').showModal()};$('#albumForm').onsubmit=async e=>{e.preventDefault();await album($('#albumName').value.trim(),$('#albumNote').value.trim());$('#dialog').close();await load()};$('#cancel').onclick=()=>$('#dialog').close();$('#refresh').onclick=load;$('#close').onclick=()=>{S.open='';$('#view').classList.remove('open')};$('#upload').onclick=()=>$('#file').click();$('#file').onchange=()=>add([...$('#file').files]);$('#closeLight').onclick=()=>$('#light').classList.remove('open');$('#light').onclick=e=>{if(e.target.id==='light')$('#light').classList.remove('open')};$('#delAlbum').onclick=async()=>{let a=S.albums.find(x=>x.id===S.open);if(!a||!confirm(`删除「${a.name}」？`))return;if(a.photos.length)await C.storage.from(BUCKET).remove(a.photos.map(p=>p.path));let r=await C.from('albums').delete().eq('id',a.id);if(r.error)throw r.error;S.open='';$('#view').classList.remove('open');await load()};
</script></body></html>
